name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROSCAN_EXT: ${{ github.workspace }}/extension
    steps:
      - uses: actions/checkout@v4

      # The schema check, the sync rules test and the e2e run the
      # extension's own schema, engine and sync module. Its main branch has
      # to carry packages/schema (extension 2.3).
      - uses: actions/checkout@v4
        with:
          repository: EnesYilmazcode/AmazonSellerScraper
          ref: main
          path: extension

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Firestore emulator needs Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache emulator jars
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.8.0

      - run: npm ci
      - run: npm ci
        working-directory: extension
      - run: npm install -g firebase-tools@15.8.0

      - name: Typecheck
        run: npm run typecheck

      - name: Schema matches the extension
        run: npm run check:schema

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Check the production bundle
        run: node scripts/check-bundle.mjs

      - name: Rules tests (emulator)
        run: npm run test:rules

      - name: Hosting rewrites and headers (emulator)
        run: npm run test:hosting

      - name: Check an emulator build
        env:
          VITE_USE_EMULATOR: 'true'
        run: npm run build && node scripts/check-bundle.mjs --emulator

      - name: Install Chromium for the e2e
        run: npx playwright install --with-deps chromium

      - name: End to end (emulator, production bundle)
        run: npm run test:e2e
